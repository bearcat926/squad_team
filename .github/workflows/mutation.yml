name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday UTC 06:00

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install -r requirements.txt

      - name: Run mutation tests (core modules)
        run: |
          mutmut run --paths-to-mutate \
            "squad_runtime/state.py" \
            "squad_runtime/gate_engine.py" \
            "squad_runtime/security/" \
            "squad_runtime/services/" \
            "squad_runtime/repositories/" \
            "squad_runtime/providers/" \
            "squad_runtime/event_store.py" || true
          mutmut results > artifacts/mutation/mutmut-results.txt || true
          python scripts/parse_mutation_score.py

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: artifacts/mutation/

      - name: Output summary
        run: |
          echo "## Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat artifacts/mutation/mutation-summary.json >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
