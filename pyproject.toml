[project]
name = "squad-runtime"
version = "0.1.0"
description = "Local single-user Squad Runtime MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "typer",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "mypy",
  "pip-audit",
  "bandit",
  "httpx",
  "mutmut>=2.4,<3",
]

[project.scripts]
squad = "squad_runtime.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["."]
markers = [
  "unit",
  "integration",
  "api",
  "security",
  "acceptance",
  "real_llm",
]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"squad_runtime/api.py" = ["B008"]
"squad_runtime/cli.py" = ["B008"]
"scripts/**/*.py" = ["E402"]

[tool.black]
line-length = 160
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["squad_runtime"]

[tool.coverage.report]
fail_under = 90

[tool.mutmut]
source_paths = ["squad_runtime/canonicalization.py"]
tests_dir = ["tests/unit/test_event_hash_chain.py"]
